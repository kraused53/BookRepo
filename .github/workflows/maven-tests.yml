name: Java CI with Maven

on:
  push:
    branches:
      - main
      - REBUILD
      - WEBAPI

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: book_library_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Initialize database schema
        env:
          MYSQL_PWD: test_password
        run: |
          mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=test_user \
            book_library_test \
            < src/test/resources/db/schema.sql

      - name: Generate test database configuration
        run: |
          mkdir -p config

          cat > config/database.properties << EOF
          db.url=jdbc:mysql://127.0.0.1:3306/book_library_test
          db.username=test_user
          db.password=test_password
          EOF

      - name: Run Maven verification
        run: mvn --batch-mode --no-transfer-progress verify
